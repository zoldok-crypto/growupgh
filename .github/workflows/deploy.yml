# Автозаливка сайта на хостинг OVH по FTPS.
#   push в main    -> www/            (боевой сайт growupgh.com)
#   push в preview -> www/preview/    (предпросмотр, закрыт от поисковиков)
# Пароль FTP лежит в Settings -> Secrets -> Actions -> FTP_PASSWORD.
name: Deploy to OVH

on:
  push:
    branches: [main, preview]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Mark preview as noindex
        if: github.ref_name == 'preview'
        run: |
          printf 'User-agent: *\nDisallow: /\n' > robots.txt
          printf 'Header set X-Robots-Tag "noindex, nofollow"\n' > .htaccess

      - name: Upload via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.cluster129.hosting.ovh.net
          username: uxjmjuq
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ github.ref_name == 'main' && 'www/' || 'www/preview/' }}
          local-dir: ./
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            tools/**
            #source/**
            prepros.config
            README.md
